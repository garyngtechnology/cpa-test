  }

  }
  function sourceDetails(q) {
    const fidelity = q.fidelity === 'source-checked-normalized' ? '原題（整理標點及格式）' : q.fidelity === 'source-four-options' ? '原題選項' : q.fidelity === 'candidate-choice-adaptation' ? '改編四選一（依原詞框）' : q.fidelity === 'summary-source-checked' ? '題意摘要練習，並非逐字原題' : q.fidelity === 'candidate-fill-adaptation' ? '原配對題改為填寫' : q.fidelity === 'source-word-list-adaptation' ? '由字詞表改編的雙向練習' : '由來源材料改編';
    return `<details class="source-details"><summary>來源與答案狀態</summary><p>${q.lessonRefs.map(r => escape(A.sourceLabel(r))).join('<br>')}</p><p>${q.sources.map(s => escape(s.fileName)).join('、')}${q.locator ? ' · ' + escape(q.locator.sectionLabel) : ''}</p><p>${escape(fidelity)}${q.choiceOrigin === 'candidate-adaptation' ? ' · 選項為 Candidate 改編，非原印刷選擇題' : ''}</p><p>${escape(statusLabel[q.verification.status])} · ${escape(q.verification.reason)}<br>來源核對日期：${escape(q.verification.reviewedOn)} · 未經教師認證</p>${q.reviewReasons.length ? `<p>覆核項目：${q.reviewReasons.map(escape).join('、')}</p>` : ''}<p>題目：${escape(q.id)}</p></details>`;
  }
  function hanziGrid(q, result) {
    const syllables = q.entry.pinyin;
    const cells = result?.cells || syllables.map((s, i) => ({expected:C.characters(q.entry.hanzi)[i], actual:'', correct:false}));
    return `<div class="hanzi-grid" id="hanzi-grid">${cells.map((cell, i) => `<div class="hanzi-cell"><div class="syllable">${syllables[i] ? escape(C.markedPinyin(syllables[i].letters, syllables[i].tone)) : '多出的字'}</div><div class="glyph ${result && !result.manual ? cell.correct ? 'correct' : 'wrong' : ''}">${result ? escape(result.correct ? cell.expected : cell.actual) : ''}</div><div class="cell-note ${cell.correct ? 'correct' : ''}">${!result || result.manual ? '' : cell.correct ? '✓' : cell.missing ? '少了一字' : cell.extra ? '多了一字' : '字形不符'}</div></div>`).join('')}</div>`;
  }
  function pinyinFields(q, draft, result) {
    return `<div class="pinyin-grid">${C.characters(q.entry.hanzi).map((character, i) => {
      const value = draft[i], cell = result?.cells?.[i];
      const state = !cell ? '' : !cell.lettersCorrect ? 'letters-wrong' : !cell.toneCorrect ? 'tone-wrong' : 'correct';
      return `<div class="pinyin-row ${state}" data-pinyin-row="${i}"><div class="pinyin-top"><span class="pinyin-character">${escape(character)}</span><div class="pinyin-field"><label for="pinyin-${i}">第 ${i + 1} 字拼音字母</label><input class="pinyin-input" id="pinyin-${i}" data-pinyin="${i}" value="${escape(value.letters)}" type="text" inputmode="text" autocapitalize="none" autocomplete="off" spellcheck="false" ${result ? 'disabled' : ''}></div><output class="pinyin-preview" id="preview-${i}" for="pinyin-${i}">${escape(value.letters ? C.markedPinyin(value.letters, value.tone) : '—')}</output></div><button type="button" class="tone-toggle" data-tone-toggle="${i}" aria-controls="tone-controls-${i}" aria-expanded="false">聲調：${value.tone === null ? '未選擇' : value.tone === 0 ? '輕聲' : value.tone + ' 聲'} ▾</button><div class="tone-controls" id="tone-controls-${i}" role="group" aria-label="第 ${i + 1} 字聲調">${[1,2,3,4,0].map(tone => `<button type="button" class="tone-button" data-syllable="${i}" data-tone="${tone}" aria-pressed="${tone === value.tone}" ${result ? 'disabled' : ''}>${tone === 0 ? '輕聲' : tone + ' 聲'}</button>`).join('')}</div>${cell && (!cell.lettersCorrect || !cell.toneCorrect) ? `<p class="tone-note wrong">${!cell.lettersCorrect ? '拼音字母不符' : '字母正確'} · ${!cell.toneCorrect ? '聲調不符' : '聲調正確'}；參考 ${escape(C.markedPinyin(cell.expected.letters, cell.expected.tone))}</p>` : ''}</div>`;
    }).join('')}</div><p class="answer-hint">每字輸入拼音字母，再選聲調。ü 保留兩點；輕聲請選「輕聲」。</p>`;
  }
  function answerFields(q, draft, result) {
    const disabled = result ? 'disabled' : '';
    if (q.kind === 'hanzi') return `${hanziGrid(q, result)}<label class="input-label" for="text-answer">輸入完整字詞</label><input id="text-answer" class="text-answer" value="${escape(draft)}" type="text" lang="zh-Hant" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" ${disabled}><p class="answer-hint">可使用系統手寫或鍵盤。完成組字後，再按提交。</p>`;
    if (q.kind === 'pinyin') return pinyinFields(q, draft, result);
    if (q.kind === 'choice') return `<fieldset class="fieldset"><legend class="input-label">選擇一項</legend><div class="choice-list">${q.options.map(o => `<label class="choice-option"><input type="radio" name="choice" value="${escape(o.id)}" ${draft === o.id ? 'checked' : ''} ${disabled}><span>${escape(o.id)}. ${escape(o.text)}</span></label>`).join('')}</div></fieldset>`;
    if (q.kind === 'slots') return `<div class="slots">${q.expected.map((_, i) => `<div class="slot-field"><label for="slot-${i}">第 ${i + 1} 個空格</label><input class="slot-answer" id="slot-${i}" data-slot="${i}" value="${escape(draft[i])}" autocomplete="off" lang="zh-Hant" ${disabled}></div>`).join('')}</div>`;
    const long = !q.autoScorable || ['quote_matching','poem_recall'].includes(q.sourceType);
    return `<label class="input-label" for="text-answer">${q.sourceType === 'true_false' ? '請填「對」或「錯」' : !q.autoScorable ? '寫下你的答案（人工批改）' : '填寫答案'}</label>${long ? `<textarea id="text-answer" class="long-answer" lang="zh-Hant" ${disabled}>${escape(draft)}</textarea>` : `<input class="text-answer" id="text-answer" value="${escape(draft)}" lang="zh-Hant" autocomplete="off" ${disabled}>`}${['quote_matching','poem_recall'].includes(q.sourceType) ? '<p class="answer-hint">可省略標點及空格；字詞仍須與題庫相符。</p>' : ''}`;
  }
  function renderQuestion() {
    clearAdvance(); composing = false; setView('quiz');
    const s = session, index = s.index, q = s.snap.questions[index], exam = s.snap.config.sessionType === 'exam';
    const result = exam ? null : s.results[index], draft = s.drafts[index];
    const count = s.snap.questions.length;
    const prompt = q.kind === 'hanzi' ? '看拼音，寫出完整字詞' : q.direction === 'hanzi-to-pinyin' ? q.entry.hanzi : q.prompt;
    screen.innerHTML = `<section aria-labelledby="quiz-title" data-question-id="${escape(q.id)}" data-kind="${q.kind}"><div class="quiz-head"><div><span class="eyebrow">${exam ? '模擬答卷' : s.retry ? '錯題重練' : '單項練習'} · 第 <span id="question-number">${index + 1}</span> / ${count} 題</span><h1 id="quiz-title">${A.LABELS[q.section]}</h1></div><button class="button quiet" id="restart-session" type="button">重新作答</button></div><div class="progress" aria-hidden="true"><span style="width:${(index + 1) / count * 100}%"></span></div>${exam ? `<p class="exam-status">答案暫存於本頁，交卷前可以修改，未即時批改。${!q.autoScorable ? '本題人工批改，不納入自動分母。' : ''}</p><nav class="exam-map" aria-label="答卷題目">${s.snap.questions.map((item, i) => `<button type="button" data-jump="${i}" class="${answered(s.drafts[i]) ? 'drafted' : ''}" aria-label="第 ${i + 1} 題" aria-current="${i === index}">${i + 1}</button>`).join('')}</nav>` : ''}<div class="panel"><div class="question-meta">${q.relation ? `<span class="chip relation">${q.relation === 'synonym' ? '近義詞' : '反義詞'}</span>` : ''}<span class="chip">${escape(statusLabel[q.verification.status])}</span>${!q.autoScorable ? '<span class="chip manual">人工批改 · 不計分</span>' : ''}${q.choiceOrigin === 'candidate-adaptation' && q.kind === 'choice' ? '<span class="chip">改編四選一</span>' : ''}</div><div class="${q.direction === 'hanzi-to-pinyin' ? 'target-word' : 'prompt'}" id="question-prompt">${escape(prompt)}</div>${q.wordBank.length ? `<aside class="wordbank"><strong>依原詞框作答${q.section === 'relations' ? '（詞框外的合理詞語暫不在本題自動接受範圍）' : ''}</strong><div class="wordbank-words">${q.wordBank.map(word => `<span>${escape(word)}</span>`).join('')}</div></aside>` : ''}${q.sourceOptions.length && q.kind !== 'choice' && q.sourceType === 'choose_character' ? `<p class="subtle">原題候選字：${q.sourceOptions.map(o => escape(o.text)).join('、')}（本練習採填寫）</p>` : ''}<form id="answer-form" novalidate>${answerFields(q, draft, result)}<p class="error" id="answer-error" role="alert" hidden></p>${!exam && !result ? '<div class="actions"><button type="button" id="submit-answer" class="button">提交答案</button></div>' : ''}</form><div id="feedback-region" role="status">${result ? feedback(q, result) : ''}</div>${!exam && result ? `<div class="actions"><button type="button" id="next-question" class="button" ${result.correct ? 'disabled' : ''}>${index + 1 === count ? '查看成績' : '下一題'}</button></div>` : ''}${exam ? `<div class="actions"><button class="button secondary" id="exam-prev" type="button" ${index === 0 ? 'disabled' : ''}>上一題</button><button class="button secondary" id="exam-next" type="button" ${index === count - 1 ? 'disabled' : ''}>下一題</button><button class="button push" id="exam-submit" type="button">交卷</button></div><div id="confirm-region"></div>` : ''}${sourceDetails(q)}</div></section>`;
    $('#restart-session').addEventListener('click', () => { if (session === s) start(s.snap, s.retry); });
    const form = $('#answer-form');
    form.addEventListener('compositionstart', () => { if (session === s && s.index === index && view === 'quiz') composing = true; }, true);
    form.addEventListener('compositionend', () => { if (session !== s || s.index !== index || view !== 'quiz') return; composing = false; endedCompositionAt = performance.now(); saveDraft(); }, true);
    form.addEventListener('input', event => { if (event.isComposing) composing = true; saveDraft(); updatePreviews(); });
    form.addEventListener('change', () => { saveDraft(); updatePreviews(); });
    form.addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      if (composing || event.isComposing || event.keyCode === 229) return;
      if (exam || performance.now() - endedCompositionAt < 80) { if (event.target.tagName !== 'TEXTAREA') event.preventDefault(); }
    });
    form.addEventListener('submit', event => { event.preventDefault(); if (!exam) submitPractice(false); });
    $('#submit-answer')?.addEventListener('click', () => submitPractice(true));
    $('#next-question')?.addEventListener('click', () => { if (session === s && s.index === index && !s.results[index]?.correct) advance(s, index); });
    screen.querySelectorAll('[data-tone-toggle]').forEach(button => button.addEventListener('click', () => {
      const row = button.closest('.pinyin-row'), open = !row.classList.contains('expanded');
      screen.querySelectorAll('.pinyin-row').forEach(r => { r.classList.remove('expanded'); r.querySelector('.tone-toggle')?.setAttribute('aria-expanded', 'false'); });
      row.classList.toggle('expanded', open); button.setAttribute('aria-expanded', String(open));
    }));
    screen.querySelectorAll('[data-tone]').forEach(button => button.addEventListener('click', () => {
      if (result || composing || session !== s) return;
      saveDraft(); s.drafts[index][Number(button.dataset.syllable)].tone = Number(button.dataset.tone); updatePreviews();
    }));
    if (exam) {
      $('#exam-prev').addEventListener('click', () => jump(index - 1, s, index));
      $('#exam-next').addEventListener('click', () => jump(index + 1, s, index));
      screen.querySelectorAll('[data-jump]').forEach(button => button.addEventListener('click', () => jump(Number(button.dataset.jump), s, index)));
      $('#exam-submit').addEventListener('click', () => requestExamSubmit(s));
    }
    if (result?.correct) scheduleAdvance(s, index);
  }
  function saveDraft() {
    if (view !== 'quiz' || !session || session.submitted) return;
    const s = session, q = s.snap.questions[s.index];
    if (s.snap.config.sessionType === 'practice' && s.results[s.index]) return;
    if (q.kind === 'pinyin') s.drafts[s.index] = [...screen.querySelectorAll('[data-pinyin]')].map((input, i) => ({letters:input.value, tone:s.drafts[s.index][i].tone}));
    else if (q.kind === 'slots') s.drafts[s.index] = [...screen.querySelectorAll('[data-slot]')].map(input => input.value);
    else if (q.kind === 'choice') s.drafts[s.index] = screen.querySelector('[name=choice]:checked')?.value || '';
    else s.drafts[s.index] = $('#text-answer')?.value || '';
    screen.querySelector(`[data-jump="${s.index}"]`)?.classList.toggle('drafted', answered(s.drafts[s.index]));
  }
  function updatePreviews() {
    const q = session?.snap.questions[session.index];
    if (!q || q.kind !== 'pinyin') return;
    session.drafts[session.index].forEach((value, i) => {
      const preview = $(`#preview-${i}`); if (preview) preview.textContent = value.letters ? C.markedPinyin(value.letters, value.tone) : '—';
      const toggle = screen.querySelector(`[data-tone-toggle="${i}"]`);
      if (toggle) toggle.textContent = `聲調：${value.tone === null ? '未選擇' : value.tone === 0 ? '輕聲' : value.tone + ' 聲'} ▾`;
      screen.querySelectorAll(`[data-syllable="${i}"]`).forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.tone) === value.tone)));
    });
  }
  function answered(value) {
    return Array.isArray(value) ? value.some(item => typeof item === 'object' ? C.normalize(item.letters) || item.tone !== null : C.normalize(item)) : Boolean(C.normalize(value));
  }
  function complete(q, value) {
    if (q.kind === 'pinyin') return value.every(s => C.normalize(s.letters) && C.toneValid(s.tone));
    if (q.kind === 'slots') return value.every(v => C.normalize(v));
    return Boolean(C.normalize(value));
  }
  function submitPractice(explicit) {
    const s = session;
    if (view !== 'quiz' || !s || s.submitted || composing || (!explicit && performance.now() - endedCompositionAt < 80) || s.results[s.index]) return;
    saveDraft(); const q = s.snap.questions[s.index], value = s.drafts[s.index];
    if (!complete(q, value)) { $('#answer-error').textContent = '請完成答案及聲調後再提交。'; $('#answer-error').hidden = false; return; }
    s.results[s.index] = C.grade(q, value); renderQuestion();
  }
  function reference(q) {
    if (q.referenceCandidates.length > 1) return q.referenceCandidates.map(value => Array.isArray(value) ? value.join('、') : String(value)).join(' ／ ');
    return C.expectedText(q) || q.sample || '本題保留人工批改，沒有唯一標準答案。';
  }
  function feedback(q, result) {
    if (result.manual) return `<div class="feedback manual"><h3>已記錄 · 待人工批改</h3><p>本題不判對錯、不納入自動分母。</p><p>候選參考${q.sample ? '／示例' : ''}（非唯一標準答案）：</p><p class="reference">${escape(reference(q))}</p></div>`;
    if (result.correct) return '<div class="feedback"><h3>答對了！</h3><p>約 1.5 秒後自動前進。</p></div>';
    return `<div class="feedback wrong"><h3>再看一看</h3><p>本題${q.verification.status === 'inferred' ? '候選' : ''}標準答案：</p><p class="reference">${escape(C.expectedText(q))}</p>${q.wordBank.length ? '<p>這題依原詞框及題庫答案批改；其他合理說法可交人工覆核。</p>' : ''}<p>看清楚後，按下方按鈕繼續。</p></div>`;
  }
  function scheduleAdvance(s, index) {
    if (document.hidden || view !== 'quiz' || session !== s || !s.results[index]?.correct) return;
    const token = generation;
    timer = setTimeout(() => { timer = null; if (session === s && generation === token && s.index === index && view === 'quiz' && !document.hidden) advance(s, index); }, 1500);
  }
  function advance(s, index) {
    if (session !== s || s.index !== index || !s.results[index]) return;
    clearAdvance();
    if (index + 1 >= s.snap.questions.length) { s.submitted = true; renderResults(); }
    else { s.index++; renderQuestion(); moveTop(); }
  }
  function jump(target, s, index) {
    if (session !== s || s.index !== index || s.submitted || composing || performance.now() < navLockUntil || target < 0 || target >= s.snap.questions.length) return;
    saveDraft(); navLockUntil = performance.now() + 250; s.index = target; renderQuestion(); moveTop();
  }
  function requestExamSubmit(s) {
    if (session !== s || composing || s.submitted) return;
    saveDraft();
    const unfinished = s.snap.questions.filter((q, i) => !complete(q, s.drafts[i])).length;
    $('#confirm-region').innerHTML = `<section class="confirm-box" aria-label="確認交卷"><h3>確認交卷？</h3><p>${unfinished ? `尚有 ${unfinished} 題未完成。自動題交卷後會按未答／不完整答案計為未答對。` : '所有題目已填寫。'}交卷後不能修改；人工題不納入自動計分。</p><div class="actions"><button type="button" id="confirm-submit" class="button">確認交卷</button><button type="button" id="cancel-submit" class="button secondary">繼續作答</button></div></section>`;
    $('#confirm-submit').addEventListener('click', () => {
      if (session !== s || composing || s.submitted || view !== 'quiz') return;
      saveDraft(); s.submitted = true; clearAdvance();
      s.results = s.snap.questions.map((q, i) => C.grade(q, s.drafts[i])); renderResults(); moveTop();
    });
    $('#cancel-submit').addEventListener('click', () => { $('#confirm-region').innerHTML = ''; });
    $('#confirm-submit').focus();
  }
  function answerText(q, value) {
    if (q.kind === 'pinyin') return value.map(s => C.markedPinyin(s.letters, s.tone) + (s.tone === null ? '（未選調）' : '')).join(' ');
    if (q.kind === 'choice') return q.options.find(o => o.id === value)?.text || '未作答';
    return Array.isArray(value) ? value.join('、') : C.normalize(value) || '未作答';
  }
  function renderResults() {
    clearAdvance(); setView('result'); const s = session;
    const summary = C.summarize(s.snap.questions, s.results);
    const wrong = s.snap.questions.filter((q, i) => s.results[i]?.correct === false);
    const review = s.snap.questions.map((q, i) => ({q, i, result:s.results[i]})).filter(row => !row.result?.correct);
    screen.innerHTML = `<section aria-labelledby="result-title"><div class="intro"><span class="eyebrow">${s.snap.config.sessionType === 'exam' ? '答卷已交回' : '本次練習已完成'}</span><h1 id="result-title">看看你的學習成果</h1></div><div class="panel"><div class="score-hero"><div class="score-number" id="score-rate">${summary.rate === null ? '—' : summary.rate + '<small>%</small>'}</div><div class="score-copy"><h2>繼續累積，一點點進步</h2><p id="score-count">${summary.total ? `自動計分答對 ${summary.correct} / ${summary.total} 題` : '本次為人工批改題，未產生自動分數'}</p><p class="subtle">共 ${s.snap.questions.length} 題 · 人工批改 ${summary.manual} 題，已排除於正確率</p></div></div><div class="section-scores">${summary.sections.map(row => `<div class="section-score" data-score-section="${row.section}"><strong>${A.LABELS[row.section]}</strong><div>${row.total ? `${row.correct} / ${row.total} 題答對` : '未計分'}${row.manual ? ` · ${row.manual} 題人工批改` : ''}</div></div>`).join('')}</div><div class="actions"><button class="button" id="retry-wrong" type="button" ${wrong.length ? '' : 'disabled'}>只重練錯題（${wrong.length}）</button><button class="button secondary" id="restart-result" type="button">整份重新作答</button><button class="button quiet" id="result-home" type="button">返回首頁</button></div><p class="answer-hint">「只重練錯題」不包含人工題。題庫內推定答案仍待覆核，成績只供本次練習參考。</p></div><div class="intro"><h2>錯題與人工批改記錄</h2><p>${review.length ? '對照題庫參考答案，記下下次要留意的地方。' : '本次自動計分題全部答對。'}</p></div><div class="review-list">${review.map(({q,i,result}) => `<article class="review-item ${result?.manual ? 'manual' : ''}" data-review-id="${escape(q.id)}"><span class="chip ${result?.manual ? 'manual' : ''}">${A.LABELS[q.section]} · ${result?.manual ? '待人工批改' : '未答對'}</span><p class="review-prompt">${escape(q.kind === 'hanzi' ? C.displayPinyin(q.entry.pinyin) : q.direction === 'hanzi-to-pinyin' ? q.entry.hanzi : q.prompt)}</p><p class="given-answer">你的答案：${escape(answerText(q, s.drafts[i]))}</p><p class="correct-answer">${result?.manual ? '候選參考／示例（不計分）' : '題庫答案'}：${escape(reference(q))}</p>${sourceDetails(q)}</article>`).join('')}</div></section>`;
    $('#retry-wrong').addEventListener('click', () => { if (!wrong.length || session !== s) return; start({version:s.snap.version, bankVersion:s.snap.bankVersion, config:{...C.clone(s.snap.config),sessionType:'practice'}, questions:C.clone(wrong)}, true); });
    $('#restart-result').addEventListener('click', () => start(s.snap, s.retry)); $('#result-home').addEventListener('click', leave);
  }
  document.addEventListener('visibilitychange', () => {
    clearAdvance();
    if (!document.hidden && view === 'quiz' && session?.snap.config.sessionType === 'practice' && session.results[session.index]?.correct) scheduleAdvance(session, session.index);
  });
  window.addEventListener('pagehide', clearAdvance);
  window.addEventListener('pageshow', () => { if (view === 'quiz' && session?.results[session.index]?.correct) { clearAdvance(); scheduleAdvance(session, session.index); } });
  load();
})();

</script>
</body>
</html>
